name: Run Black Hat Bot
on:
  schedule:
    - cron: "0 */6 * * *"  # هەر ٦ کاتژمێر جارێک
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # کەمێک کەمتر لە ٦ کاتژمێر
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyTelegramBotAPI
      - run: python bot.py
